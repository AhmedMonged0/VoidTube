name: Build VoidTube Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/VoidTube.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidTube-Android-APK
          path: build-output/VoidTube.apk
          if-no-files-found: error

  build-ios:
    name: 🍏 Build iOS Release IPA (Unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Archive & Build Unsigned IPA for Sideloading
        run: |
          cd ios/App
          xcodebuild -scheme App \
            -workspace App.xcworkspace \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r -9 VoidTube.ipa Payload
          mkdir -p ../../build-output
          cp VoidTube.ipa ../../build-output/VoidTube.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidTube-iOS-IPA
          path: build-output/VoidTube.ipa
          if-no-files-found: error

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: VoidTube-Android-APK
          path: release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: VoidTube-iOS-IPA
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.10
          name: VoidTube v1.0.10 (Android APK & iOS IPA)
          body: |
            ## 🌌 VoidTube Mobile Release v1.0.10
            
            ### 📥 Download Links:
            - **🤖 Android APK:** [VoidTube.apk](https://github.com/AhmedMonged0/VoidTube/releases/download/v1.0.10/VoidTube.apk)
            - **🍏 iOS IPA (Unsigned):** [VoidTube.ipa](https://github.com/AhmedMonged0/VoidTube/releases/download/v1.0.10/VoidTube.ipa)
            
            ---
            ### 📱 iOS Installation Note:
            This `.ipa` is packaged for sideloading and signing with your personal/developer certificate via:
            - **ESign** (تطبيق إي-ساين)
            - **Scarlet** (سكارليت)
            - **TrollStore** (ترول ستور)
            - **AltStore** (ألت ستور)
            - **Sideloadly**
          files: |
            release-assets/VoidTube.apk
            release-assets/VoidTube.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
